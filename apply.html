<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استبيان التأهيل | غرس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16261c;
    --ink-2:#e3f0e6;
    --ink-3:#d8eadd;
    --amber:#1f5c42;
    --amber-light:#2f7a56;
    --violet:#b8934a;
    --violet-light:#9c7a3c;
    --ivory:#faf8f2;
    --ivory-dim:#5a6a5f;
    --card:#ffffff;
    --border:rgba(31,92,66,0.18);
    --border-2:rgba(184,147,74,0.3);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ivory);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  h1,h2,h3{ font-family:'Tajawal', sans-serif; }
  .font-amiri{ font-family:'Amiri', serif; }

  .nav{
    display:flex; align-items:center; justify-content:center;
    padding:20px 0;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; color:var(--amber-light); }
  .brand svg{ width:24px; height:24px; }
  .brand span{ font-family:'Amiri', serif; font-style:italic; }

  /* ---------- PROGRESS ---------- */
  .progress-wrap{
    height:4px; background:rgba(242,239,233,0.08); width:100%;
  }
  .progress-bar{
    height:100%; background:linear-gradient(90deg, var(--violet-light), var(--amber-light));
    width:0%; transition:width .35s ease;
  }

  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .card{
    max-width:560px; width:100%;
  }
  .qnum{
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:13px;
    color:var(--amber-light);
    background:rgba(31,92,66,0.10);
    border:1px solid var(--border);
    display:inline-block; padding:5px 14px; border-radius:999px;
    margin-bottom:18px;
  }
  .qtext{
    font-size:24px; font-weight:800; line-height:1.5; color:var(--ink);
    margin-bottom:8px;
  }
  .qhint{ font-size:14px; color:var(--ivory-dim); margin-bottom:26px; }

  .options{ display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }
  .opt{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1.5px solid rgba(242,239,233,0.10);
    border-radius:12px; padding:16px 18px;
    cursor:pointer; transition:border-color .15s, background .15s;
    font-size:15.5px; color:var(--ink);
  }
  .opt:hover{ border-color:var(--border-2); }
  .opt.selected{
    border-color:var(--violet-light);
    background:rgba(184,147,74,0.08);
  }
  .opt .letter{
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:13px;
    color:var(--ivory-dim); background:rgba(242,239,233,0.06);
    border:1px solid rgba(242,239,233,0.14);
    width:26px; height:26px; border-radius:7px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .opt.selected .letter{
    background:var(--violet-light); color:#ffffff; border-color:var(--violet-light);
  }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:14px; color:var(--ivory-dim); margin-bottom:8px; }
  .field input{
    width:100%; padding:14px 16px; border-radius:10px;
    background:var(--card); border:1.5px solid rgba(242,239,233,0.12);
    color:var(--ink); font-size:15.5px; font-family:'IBM Plex Sans Arabic', sans-serif;
    direction:rtl;
  }
  .field input:focus{ outline:none; border-color:var(--violet-light); }
  .field input::placeholder{ color:rgba(185,188,201,0.5); }

  .nav-row{ display:flex; gap:12px; align-items:center; }
  .btn-next{
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:15.5px;
    background:linear-gradient(180deg, var(--amber-light), var(--amber));
    color:#ffffff; padding:14px 34px; border-radius:10px;
    border:none; cursor:pointer;
  }
  .btn-next:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-back{
    font-family:'IBM Plex Sans Arabic', sans-serif; font-size:14px;
    color:var(--ivory-dim); background:none; border:none; cursor:pointer;
    padding:14px 10px;
  }
  .err{ font-size:13px; color:#e08a7d; margin-top:-8px; margin-bottom:16px; display:none; }

  /* ---------- INTRO / OUTRO ---------- */
  .center-text{ text-align:center; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:13.5px;
    color:var(--amber-light);
    background:rgba(31,92,66,0.10);
    border:1px solid var(--border);
    padding:7px 18px; border-radius:999px;
    margin-bottom:22px;
  }
  .center-text h1{ font-size:28px; font-weight:900; line-height:1.5; margin-bottom:14px; }
  .center-text p.sub{ font-size:15.5px; color:var(--ivory-dim); margin-bottom:30px; }
  .checkmark{
    width:60px; height:60px; border-radius:50%;
    background:rgba(184,147,74,0.14); border:1px solid var(--border-2);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 22px; font-size:26px;
  }

  footer{
    text-align:center; padding:20px 0; color:var(--ivory-dim);
    font-size:12px; opacity:0.6;
  }
</style>
</head>
<body>

  <div class="nav">
    <span class="brand">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="navLeafGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#1F5C42"/>
            <stop offset="100%" stop-color="#8FBF9F"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="150" r="14" fill="#B8934A"/>
        <path d="M100 145 C 100 100, 70 70, 35 55 C 45 95, 65 125, 100 145 Z" fill="url(#navLeafGrad)"/>
        <path d="M100 145 C 100 90, 135 60, 170 45 C 158 90, 135 122, 100 145 Z" fill="url(#navLeafGrad)" opacity="0.85"/>
        <path d="M100 145 L100 60" stroke="#1F5C42" stroke-width="3" fill="none" opacity="0.5"/>
      </svg>
      <span>غرس</span>
    </span>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="stage">
    <div class="card" id="cardArea"></div>
  </div>

  <footer>استبيان غرس — إجاباتك تساعدنا نرشدك للخطوة الأنسب لك</footer>

<script>
(function(){

  var WHATSAPP_NUMBER = "963982983100";

  var steps = [
    { type:"intro" },
    {
      type:"single",
      key:"experience",
      text:"ما هو مستواك الحالي في العمل الرقمي؟",
      hint:"اختر الأقرب لوضعك",
      options:[
        "ما بديت أبد",
        "بديت لكن ما حققت مبيعات",
        "حققت مبيعات بسيطة",
        "عندي مصدر دخل رقمي فعلاً"
      ]
    },
    {
      type:"single",
      key:"motivation",
      text:"ليش تدور على مصدر دخل رقمي؟",
      hint:"اختر السبب الأقرب لك",
      options:[
        "أبي أستقل ماليًا",
        "أبي دخل إضافي جنب شغلي",
        "تعبت من الوظيفة التقليدية",
        "أبي أطوّر مهارة جديدة"
      ]
    },
    {
      type:"single",
      key:"time",
      text:"كم الوقت اللي تقدر تخصصه أسبوعيًا؟",
      hint:"بشكل تقريبي",
      options:[
        "أقل من 3 ساعات",
        "3 – 7 ساعات",
        "7 – 15 ساعة",
        "أكثر من 15 ساعة"
      ]
    },
    {
      type:"single",
      key:"budget",
      text:"كم المبلغ المتوفر عندك حاليًا للبدء؟",
      hint:"الأموال المتاحة اليوم فقط، وليست المستقبلية أو المقترضة",
      options:[
        "0 – 500 ريال",
        "500 – 1,000 ريال",
        "1,000 – 3,000 ريال",
        "أكثر من 3,000 ريال"
      ]
    },
    { type:"contact" },
    { type:"outro" }
  ];

  var current = 0;
  var answers = {};
  var cardArea = document.getElementById("cardArea");
  var progressBar = document.getElementById("progressBar");

  function updateProgress(){
    var answerable = steps.filter(function(s){ return s.type !== "intro" && s.type !== "outro"; }).length;
    var doneIndex = Math.max(0, current - 1);
    var pct = current === 0 ? 0 : Math.min(100, (doneIndex / answerable) * 100);
    if(steps[current].type === "outro") pct = 100;
    progressBar.style.width = pct + "%";
  }

  function render(){
    updateProgress();
    var step = steps[current];
    cardArea.innerHTML = "";

    if(step.type === "intro"){
      cardArea.innerHTML =
        '<div class="center-text">' +
          '<span class="eyebrow">استبيان سريع — دقيقة واحدة</span>' +
          '<h1>خلّنا نتعرف على وضعك الحالي</h1>' +
          '<p class="sub">أربع أسئلة بسيطة تساعدنا نرشدك للخطوة الأنسب لك — ثم اترك بياناتك وبنتواصل معك.</p>' +
          '<button class="btn-next" id="startBtn">ابدأ</button>' +
        '</div>';
      document.getElementById("startBtn").onclick = function(){ current++; render(); };
      return;
    }

    if(step.type === "outro"){
      cardArea.innerHTML =
        '<div class="center-text">' +
          '<div class="checkmark">✓</div>' +
          '<h1>تم الإرسال، يعطيك العافية</h1>' +
          '<p class="sub">وصلتنا إجاباتك وبنتواصل معك قريبًا عبر واتساب. تقدر تراسلنا مباشرة إذا حاب تسأل أي شي الحين.</p>' +
          '<a id="waDirectLink" target="_blank" rel="noopener noreferrer" class="btn-next" style="text-decoration:none; display:inline-block;">راسلنا الآن عبر واتساب</a>' +
        '</div>';
      var waLink = "https://wa.me/" + WHATSAPP_NUMBER;
      document.getElementById("waDirectLink").href = waLink;
      return;
    }

    if(step.type === "single"){
      var html = '<div class="qnum">سؤال ' + (current) + ' من 4</div>';
      html += '<div class="qtext">' + step.text + '</div>';
      html += '<div class="qhint">' + step.hint + '</div>';
      html += '<div class="options" id="optsWrap">';
      var letters = ["أ","ب","ج","د"];
      step.options.forEach(function(opt, i){
        var sel = answers[step.key] === opt ? " selected" : "";
        html += '<div class="opt' + sel + '" data-value="' + opt + '">' +
                  '<span class="letter">' + letters[i] + '</span><span>' + opt + '</span>' +
                '</div>';
      });
      html += '</div>';
      html += '<div class="nav-row">' +
                (current > 1 ? '<button class="btn-back" id="backBtn">رجوع</button>' : '') +
                '<button class="btn-next" id="nextBtn" ' + (answers[step.key] ? '' : 'disabled') + '>متابعة</button>' +
              '</div>';
      cardArea.innerHTML = html;

      document.querySelectorAll('.opt').forEach(function(el){
        el.addEventListener('click', function(){
          document.querySelectorAll('.opt').forEach(function(o){ o.classList.remove('selected'); });
          el.classList.add('selected');
          answers[step.key] = el.getAttribute('data-value');
          document.getElementById('nextBtn').disabled = false;
        });
      });
      document.getElementById('nextBtn').onclick = function(){ current++; render(); };
      if(document.getElementById('backBtn')){
        document.getElementById('backBtn').onclick = function(){ current--; render(); };
      }
      return;
    }

    if(step.type === "contact"){
      var html = '<div class="qnum">آخر خطوة</div>';
      html += '<div class="qtext">وين نتواصل معك؟</div>';
      html += '<div class="qhint">بنرسل لك التفاصيل والخطوة التالية مباشرة</div>';
      html += '<div class="field"><label>الاسم (اختياري)</label><input type="text" id="fName" placeholder="اسمك"></div>';
      html += '<div class="field"><label>رقم واتساب</label><input type="tel" id="fPhone" placeholder="مثال: 9665XXXXXXXX" inputmode="tel"></div>';
      html += '<div class="err" id="fErr">الرجاء إدخال رقم واتساب صحيح</div>';
      html += '<div class="nav-row">' +
                '<button class="btn-back" id="backBtn">رجوع</button>' +
                '<button class="btn-next" id="submitBtn">إرسال</button>' +
              '</div>';
      cardArea.innerHTML = html;

      document.getElementById('backBtn').onclick = function(){ current--; render(); };
      document.getElementById('submitBtn').onclick = function(){
        var name = document.getElementById('fName').value.trim();
        var phone = document.getElementById('fPhone').value.trim().replace(/[^0-9]/g, "");
        if(phone.length < 8){
          document.getElementById('fErr').style.display = "block";
          return;
        }
        answers.name = name;
        answers.phone = phone;
        submitAnswers();
      };
      return;
    }
  }

  function submitAnswers(){
    var lines = [];
    lines.push("تسجيل جديد من استبيان غرس");
    if(answers.name) lines.push("الاسم: " + answers.name);
    lines.push("مستوى الخبرة: " + (answers.experience || "-"));
    lines.push("الدافع: " + (answers.motivation || "-"));
    lines.push("الوقت المتاح أسبوعيًا: " + (answers.time || "-"));
    lines.push("الميزانية المتاحة: " + (answers.budget || "-"));
    lines.push("رقم واتساب العميل: " + answers.phone);

    var msg = encodeURIComponent(lines.join("\n"));
    var waLink = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + msg;

    window.open(waLink, "_blank", "noopener,noreferrer");
    current = steps.length - 1;
    render();
  }

  render();
})();
</script>

</body>
</html>
